# Routes qBittorrent - and only qBittorrent - through a VPN with a killswitch.
# The Makefile layers this on when VPN_ENABLED=true in .env.
#
# Why only qBittorrent: it is the only service that talks to swarm peers, who
# would otherwise all see your home IP. Prowlarr merely searches, and Jellyfin
# must stay reachable on your LAN, so tunnelling those gains nothing and breaks
# things.
#
# qBittorrent gives up its own network stack for Gluetun's, which means:
#   - its ports are published by gluetun, not by it (hence the `!reset`)
#   - other containers reach it at http://gluetun:${QBITTORRENT_PORT},
#     which provision.py does automatically while VPN_ENABLED=true
#   - if the tunnel drops, Gluetun's firewall drops the traffic rather than
#     leaking it. That is the whole point.
services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_TAG}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
      - "${BT_PORT}:${BT_PORT}"
      - "${BT_PORT}:${BT_PORT}/udp"
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${VPN_COUNTRIES}
      # Lets the other containers on the compose network reach qBittorrent's
      # WebUI inside this namespace, and lets the return traffic back out.
      # Ask the provider for an inbound port and hand it straight to qBittorrent.
      # Without inbound you only reach peers who can reach you, which is the
      # usual reason a tunnelled client crawls. {{PORT}} is gluetun's substitution.
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -qO- --post-data="json={\"listen_port\":{{PORT}}}"
        http://127.0.0.1:${QBITTORRENT_PORT}/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -qO- --post-data="json={\"listen_port\":0}"
        http://127.0.0.1:${QBITTORRENT_PORT}/api/v2/app/setPreferences'
      FIREWALL_INPUT_PORTS: ${QBITTORRENT_PORT}
      FIREWALL_OUTBOUND_SUBNETS: ${DOCKER_SUBNET}
    volumes:
      - ./config/gluetun:/gluetun

  qbittorrent:
    network_mode: "service:gluetun"
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy
