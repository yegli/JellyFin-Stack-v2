# ---------------------------------------------------------------------------
# Pinning a mirror, when a tracker's main domain is blocked by your ISP.
# `baseUrl` options come from the definition; Prowlarr -> the indexer's edit
# dialog lists them.
#
# [[indexer]]
# definition = "1337x"
# priority = 20
# [indexer.settings]
# baseUrl = "https://1337x.st/"
#
# A private tracker, credentials from the environment
# (export TRACKER_KEY=... in your shell or ~/.zshrc):
#
# [[indexer]]
# definition = "SomePrivateTracker"
# priority = 5                       # private trackers deserve to win
# [indexer.settings]
# apikey = "${TRACKER_KEY}"
